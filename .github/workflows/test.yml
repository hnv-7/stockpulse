name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # API tests run on an in-process Postgres (PGlite), with fake market data: no secrets or network needed.
      - run: npm test
      - name: Build the client
        run: npm run build
